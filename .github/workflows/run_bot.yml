name: Jyouhou Tackle Watcher

on:
  schedule:
    # JST(日本時間)で実行するため、UTC指定(JST-9時間)で記述します。※既存の設定があれば維持してください。
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run bot
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }} # ★追加: テスト送信用のユーザーID
        run: python jyouhou_bot.py
        
      - name: Commit and push DB changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add products.db
          git commit -m "Update products database [skip ci]" || exit 0
          git push
