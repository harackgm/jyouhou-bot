name: Jyouhou Tackle Watcher

on:
  workflow_dispatch: # 外部Cronjob(cron-job.org等)からのAPI呼び出し、または手動実行のみ

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run bot
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: python jyouhou_bot.py
        
      - name: Commit and push DB changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add products.db
          git commit -m "Update products database [skip ci]" || exit 0
          git push
